<!--Fidget (NOT Figet) //Developer Spelling Issue-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Robert's Fidgets&trade;</title>
    
    <style>
      body {
        background-image: url('robert-fidget.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        padding-left: 25px;
      }
      #sector-1 {
        color: rgb(0, 0, 255);
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <section id="sector-1">
      <u onclick="order()">Order</u>
      <br>
      <u onclick="aboutUs()">About Us</u>
      <br>
      <u onclick="more()">More</u>
    </section>
    
    <!--Main Body-->
    
    <script>
    function autoRun() {
      alert("Robert's Fidgets™ Official Site");
    }

    let roll = Math.floor(Math.random() * 10) + 1;
    if (roll === 10) {
      let ratingInput = prompt("How much do you enjoy Robert's Fidgets™?\nFrom 1 - 5\n\n");
      let rating = parseInt(ratingInput, 10);

      if (rating >= 3 && rating <= 5) {
        alert("Thank You!");
      } else if (rating === 1 || rating === 2) {
        let why = prompt("Anything you didn't like?\n\n");
        if (!why || why.trim() === "") {
          alert("Input Can't Be Empty!");
          why = prompt("But what didn't you like?\n\n");
        }
        alert("Thank You for your review! We will see what we can do!");
      } else {
        alert("Potential Invalid Option!\n\nPlease check if rating is a valid option!");
      }
    } else {
      autoRun();
    }

    function order() {
      document.body.innerHTML = `
      <meta charset="utf-8">
      <style>
        body {
          color: rgb(0, 0, 0);
          background-image: none;
          padding: 20px;
          font-family: sans-serif;
        }
        form {
          max-width: 400px;
        }
        label {
          display: block;
          margin-top: 12px;
          font-weight: bold;
        }
        input, select, textarea {
          width: 100%;
          padding: 8px;
          margin-top: 5px;
          box-sizing: border-box;
        }
        button {
          margin-top: 15px;
          padding: 10px 15px;
          cursor: pointer;
          font-weight: bold;
        }
      </style>
      
      <h2>Order Robert's Fidgets&trade;</h2>
      <form action="mailto:robbie.blink182@outlook.com" method="post" enctype="text/plain" id="order_fidget">
        
        <label for="user_name">Name:</label>
        <input type="text" id="user_name" name="Customer Name" placeholder="Enter your full name" required>

        <label for="fidget_item">Select Fidget:</label>
        <select id="fidget_item" name="Selected Item" required>
          <option value="" disabled selected>-- Choose a fidget --</option>
          <option value="Fidget Spinner">Fidget Spinner</option>
          <option value="Infinite Cube">Infinite Cube</option>
          <option value="Egg">Dragon Egg</option>
        </select>

        <label for="fidget_quantity">Quantity (Max 3):</label>
        <input type="number" id="fidget_quantity" name="Quantity" min="1" max="3" value="1" required>

        <label for="message">Additional Notes:</label>
        <textarea id="message" name="Notes" rows="4" placeholder="Any special requests or details..."></textarea>

        <button type="submit">Submit Order via Email</button>
      </form>
      `;
    }

    function aboutUs() {
      document.body.innerHTML = `
      <meta charset="utf-8">
      <style>
      body {
        color: rgb(128, 0, 0);
      }
      </style>
      
      <b>Founder:</b> Robert Bewely
      <br>
      <b>Developer:</b> Avery Mancini
      <br>
      <b>1<small>st</small> Employee:</b> Andrei Estacio
      <br>
      <b>Salesmen:</b>
      <ul>
      <li>Lorenzo - Un Amico Di Mio</li>
      <li>Hugo Bruelliac</li>
      </ul>
      `;
    }

    function more() {
      document.body.innerHTML = `
      <meta charset="utf-8">
      <style>
      body {
        color: rgb(128, 0, 0);
      }
      </style>
      &bull; TOU: Empty
      <br>
      &bull; PP (Pee Pee): Empty
      <br>
      &copy; 2026 Robert's Fidgets&trade; | All Rights Reserved
      `;
    }
    </script>
  </body>
</html>
